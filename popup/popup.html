<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrowserLock</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <svg class="popup-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect x="14" y="30" width="36" height="26" rx="6" fill="#e94560"/>
        <path d="M22 30V22a10 10 0 0120 0v8" fill="none" stroke="#e94560" stroke-width="4" stroke-linecap="round"/>
        <circle cx="32" cy="43" r="4" fill="#1a1a2e"/>
      </svg>
      <span class="popup-title">BrowserLock</span>
    </div>

    <!-- Setup Required View -->
    <div id="setupRequired" class="popup-section hidden">
      <p class="popup-text">Setup is required before using BrowserLock.</p>
      <button class="popup-btn popup-btn-primary" id="openSetupBtn">Complete Setup</button>
    </div>

    <!-- Unlocked View -->
    <div id="unlockedView" class="popup-section hidden">
      <div class="status-badge status-unlocked">
        <span class="status-dot"></span>
        <span>Unlocked</span>
      </div>

      <div id="tempUnlockInfo" class="temp-unlock-info hidden">
        <span>⏱️ Auto-locks in:</span>
        <span class="temp-timer" id="tempTimer">--:--</span>
      </div>

      <button class="popup-btn popup-btn-primary" id="lockBtn">
        <svg viewBox="0 0 20 20" fill="currentColor" width="16" height="16">
          <path d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"/>
        </svg>
        Lock Now
      </button>

      <div class="divider"></div>

      <div class="temp-unlock-section">
        <label class="section-label">Temporary Unlock</label>
        <div class="temp-unlock-grid">
          <button class="popup-btn popup-btn-outline temp-btn" data-minutes="15">15 min</button>
          <button class="popup-btn popup-btn-outline temp-btn" data-minutes="30">30 min</button>
          <button class="popup-btn popup-btn-outline temp-btn" data-minutes="60">1 hour</button>
          <button class="popup-btn popup-btn-outline temp-btn" data-minutes="120">2 hours</button>
        </div>
      </div>
    </div>

    <!-- Locked View -->
    <div id="lockedView" class="popup-section hidden">
      <div class="status-badge status-locked">
        <span class="status-dot"></span>
        <span>Locked</span>
      </div>
      <p class="popup-text">Browser is locked. Enter password on any tab to unlock.</p>
    </div>

    <div class="popup-footer">
      <a href="#" id="settingsLink" class="footer-link">
        <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
          <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
        </svg>
        Settings
      </a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
